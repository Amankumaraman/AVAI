<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Outer AI Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyanGrad)" stroke-width="16" filter="url(#glow)"/>
  
  <!-- Outer Shield Nodes -->
  <circle cx="256" cy="106" r="14" fill="#06b6d4"/>
  <circle cx="406" cy="256" r="14" fill="#6366f1"/>
  <circle cx="256" cy="406" r="14" fill="#06b6d4"/>
  <circle cx="106" cy="256" r="14" fill="#6366f1"/>

  <!-- Inner Cybernetic Lens Pupil -->
  <circle cx="256" cy="256" r="90" fill="url(#purpleGrad)"/>
  <circle cx="256" cy="256" r="54" fill="#070a12" stroke="#06b6d4" stroke-width="8"/>
  <circle cx="276" cy="236" r="18" fill="#ffffff" opacity="0.9"/>
</svg>